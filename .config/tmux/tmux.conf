# Start window index with 1
set -g base-index 1
setw -g pane-base-index 1

# TERM inside tmux
set -g default-terminal "tmux-256color"
# Ghostty supports 24-bit colour (tmux 3.6+ also detects COLORTERM=truecolor)
set -as terminal-features ",xterm-ghostty:RGB"

# Image previews (Yazi etc.) and Claude Code notifications need passthrough
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Use mousewheel to scroll buffer and select panes
set -g mouse on

# Extended keys so combinations like Ctrl+Shift+key and Shift+Enter reach apps
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',xterm-ghostty:extkeys'

# Relay Shift+Enter as CSI-u.
bind -n S-Enter send-keys Escape "[13;2u"

# Scroll 2 lines at a time instead of default 5; don't extend dragged selections.
bind-key -T copy-mode-vi WheelUpPane {
  select-pane
  send-keys -t'{mouse}' -X clear-selection
  send-keys -t'{mouse}' -X -N 2 scroll-up
}
bind-key -T copy-mode-vi WheelDownPane {
  select-pane
  send-keys -t'{mouse}' -X clear-selection
  send-keys -t'{mouse}' -X -N 2 scroll-down
}

# For those times when C-c and q are not enough.
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Include characters /-+\~_ in work selection, by removing them from word separators
set -g word-separators " \"'()[]{}<>,;"

